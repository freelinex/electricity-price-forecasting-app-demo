[project]
name = "electricity-forecasting-backend"
version = "0.1.0"
description = "Backend service for electricity price forecasting platform — REST API, data ingestion, and ML model integration."
authors = [
    {name = "Psychox1k", email = "success01001011@gmail.com"},
    {name = "ssokolowskisebastian", email = "ssokolowskisebastian@gmail.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "entsoe-py (>=0.8.0,<0.9.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "holidays (>=0.103,<0.104)",
    "astral (>=3.2,<4.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "pyarrow (>=25.0.1,<26.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "uvicorn (>=0.52.4,<0.53.0)"
]
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pandas-stubs (>=3.0.5,<3.1.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
