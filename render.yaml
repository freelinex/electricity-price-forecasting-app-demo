services:
  - type: web
    name: voltio-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install poetry==2.4.3 && poetry install --only main --no-interaction
    startCommand: poetry run uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: DATA_DIR
        value: /tmp/voltio-data
      - key: HISTORY_DAYS
        value: "90"
      - key: FORECAST_REFRESH_ENABLED
        value: "true"
      - key: FORECAST_REFRESH_SECONDS
        value: "3600"
      - key: FORECAST_MAX_AGE_SECONDS
        value: "86400"
      - key: ENTSOE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COUNTRY
        value: PL
      - key: OMP_NUM_THREADS
        value: "1"
